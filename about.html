<title>DRESSFINDER — Local Shopping Discovery</title>
<style>
:root{--ink:#151515;--muted:#707070;--line:#e8e8e8;--bg:#f6f6f7;--card:#fff;--soft:#f0f1f3;--good:#087a3d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
.app{width:min(100%,480px);margin:auto;background:#fff;min-height:100vh;padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:13px 14px}
.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900;letter-spacing:1px}.tag{font-size:11px;color:var(--muted);margin-top:2px}
.iconbtn{border:0;background:var(--soft);border-radius:11px;padding:9px;cursor:pointer}
.search{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:13px;padding:10px 12px;margin-top:11px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:14px}
main{padding:14px}.hero{background:#111;color:#fff;border-radius:19px;padding:20px;margin-bottom:13px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#ddd;font-size:12px;line-height:1.5}
.location{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:12px 0}.location small{display:block;color:var(--muted);margin-top:2px}
.btn{border:0;border-radius:10px;background:#111;color:#fff;padding:9px 12px;font-weight:700;cursor:pointer}.btn.light{background:var(--soft);color:#111}.btn.good{background:#087a3d}
h2{font-size:18px;margin:20px 0 10px}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cat{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 3px;text-align:center;cursor:pointer;font-size:11px}.cat b{display:block;font-size:20px;margin-bottom:4px}
.horizontal{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;cursor:pointer}.chip.active{background:#111;color:#fff;border-color:#111}
.itembar{display:flex;align-items:center;justify-content:space-between;gap:8px}.itembar .selected{font-weight:800}.itemscroll{display:flex;gap:7px;overflow:auto;padding:8px 0 3px}
.panel{border:1px solid var(--line);border-radius:15px;padding:11px;margin-top:10px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field select,.field input{width:100%;padding:9px;border:1px solid #ddd;border-radius:10px;background:#fff}
.card{border:1px solid var(--line);border-radius:15px;padding:12px;margin:9px 0;background:#fff}.card h3{font-size:15px;margin:0 0 5px}.meta{font-size:11px;color:var(--muted);line-height:1.55}.price{font-weight:900;font-size:17px;margin-top:7px}.stock{font-size:11px;color:var(--good);font-weight:700;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions .btn{font-size:11px;padding:8px 9px}.shophead{display:flex;justify-content:space-between;gap:8px}.offer{background:#f7f7f7;border-radius:10px;padding:8px;margin-top:8px;font-size:11px}
.shopnav{display:flex;gap:8px;overflow:auto}.shopnav .chip{font-weight:700}
.empty{padding:14px;border:1px dashed #bbb;border-radius:12px;color:#666;text-align:center;font-size:12px}
.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}
.bottom button{border:0;background:#fff;color:#555;font-size:9px;cursor:pointer}.bottom b{display:block;font-size:17px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.open{display:flex}.modalbox{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right;border:0;background:var(--soft);border-radius:9px;padding:7px;cursor:pointer}
.shopHero{background:#111;color:#fff;border-radius:17px;padding:17px}.shopHero .meta{color:#ccc}.pill{display:inline-block;background:#eee;color:#111;border-radius:20px;padding:6px 9px;font-size:10px;margin:4px 4px 0 0}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{border:0;background:var(--soft);padding:8px 11px;border-radius:16px;font-size:11px;cursor:pointer}.tab.active{background:#111;color:#fff}
.toast{position:fixed;z-index:80;bottom:88px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;display:none}
</style>
</head>

baseProducts.forEach((p,i)=>{
  // Every sample product has multiple sizes/stock entries so filters never become unusable.
  ["S","M","L","XL"].forEach((s,j)=>products.push({id:i+"-"+s,name:p[0],cat:p[1],item:p[2],brand:p[3],color:p[4],size:s,price:p[5]+(j===3?100:0),stock:(j%3)+1,shop:(i+2)%shops.length}));

let category=localStorage.getItem("df_category")||"Gents";
let selectedItem=localStorage.getItem("df_item")||"All Items";

let activeShopTab="All";

function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function setCategory(c){category=c;selectedItem="All Items";localStorage.setItem("df_category",c);localStorage.setItem("df_item",selectedItem);renderAll();window.scrollTo({top:0})}
function goHome(){category="Gents";selectedItem="All Items";renderAll();window.scrollTo({top:0})}
function chooseItem(x){selectedItem=x==="🔥 Trending"?"🔥 Trending":x;localStorage.setItem("df_item",selectedItem);renderAll()}
function itemProducts(){
 let q=document.getElementById("search")?.value?.toLowerCase().trim()||"";
 return products.filter(p=>{
  let catOk=p.cat===category;
  let itemOk=selectedItem==="All Items"||selectedItem==="🔥 Trending"? (selectedItem==="🔥 Trending"?trends[category].includes(p.item):true):p.item===selectedItem;
  let searchOk=!q||[p.name,p.item,p.brand,p.color,p.size].join(" ").toLowerCase().includes(q);
  return catOk&&itemOk&&searchOk;
 })
}
function availableBrands(data){return [...new Set(data.map(p=>p.brand))]}
function renderAll(){
 let main=document.getElementById("main");
 main.innerHTML=`
 <section class="hero"><h1>Find Your Style Nearby</h1><p>Choose a category, see every trending item, compare prices, check colour & size availability, then pick the best shop.</p></section>
 <div class="location"><div>📍 <b>${esc(locationName)}</b><small>Shopping area</small></div><button class="btn" onclick="openLocation()">Change</button></div>
 <h2>Shop by Category</h2><div class="cats">
 ${[['Gents','👕'],['Ladies','👗'],['Kids','🧒'],['Shoes','👟'],['Bags','🎒']].map(a=>`<div class="cat" onclick="setCategory('${a[0]}')"><b>${a[1]}</b>${a[0]}</div>`).join("")}</div>
 <h2>🔥 Trending — ${esc(category)}</h2><div class="horizontal">${trends[category].map(x=>`<button class="chip ${selectedItem===x?'active':''}" onclick="chooseItem('${x}')">🔥 ${x}</button>`).join("")}</div>
 <div class="itembar"><h2 style="margin-bottom:0">${esc(category)}</h2><button class="btn light" onclick="toggleItemList()">Wear / Item ▼</button></div>
 <div id="itemList" class="itemscroll">${itemData[category].map(x=>`<button class="chip ${selectedItem===x?'active':''}" onclick="chooseItem('${esc(x)}')">${esc(x)}</button>`).join("")}</div>
 <div class="panel"><b>🎯 Selected: ${esc(selectedItem)}</b><div class="meta">Brand list below is generated from the selected item. Every listed combination has sample stock.</div>

 <div class="field"><label>Size</label><select id="fSize" onchange="renderProductCards()"><option value="">All sizes</option>${sizes.map(x=>`<option>${x}</option>`).join("")}</select></div>

 <h2>🛍️ Available Products & Price Compare</h2><div id="productCards"></div>
 <h2>🏪 Best Nearby Shops</h2><div class="meta">Up to 20 sample shops are available. Choose a shop to see ALL its category inventory.</div>
 <div class="panel"><div class="field"><label>Radius</label><select id="radius" onchange="renderShops()"><option value="20">20 km</option><option value="1">1 km</option><option value="2">2 km</option><option value="5">5 km</option><option value="10">10 km</option><option value="15">15 km</option></select></div></div>

function toggleItemList(){let x=document.getElementById("itemList");x.style.display=x.style.display==="none"?"flex":"none"}
function renderProductCards(){
 let data=itemProducts();let b=document.getElementById("fBrand")?.value||"",c=document.getElementById("fColor")?.value||"",s=document.getElementById("fSize")?.value||"",p=+document.getElementById("fPrice")?.value||0;
 data=data.filter(x=>(!b||x.brand===b)&&(!c||x.color===c)&&(!s||x.size===s)&&(!p||x.price<p||p===5000));
 // Never show "No match found": if a filter combination has no exact sample, show the closest matching sample data.
 if(!data.length){data=itemProducts().filter(x=>(!b||x.brand===b)&&(!c||x.color===c)&&(!s||x.size===s));}
 if(!data.length)data=itemProducts();
 document.getElementById("productCards").innerHTML=data.slice(0,12).map(x=>{
  let sh=shops[x.shop];
  return `<div class="card"><h3>${esc(x.name)}</h3><div class="meta">${esc(x.item)} · ${esc(x.brand)} · ${esc(x.color)} · Size ${esc(x.size)}</div><div class="price">₹${x.price.toLocaleString()}</div><div class="stock">✓ ${x.stock} available now</div><div class="meta">🏪 ${esc(sh[0])} · ${sh[2]} km</div><div class="actions"><button class="btn" onclick="shopDetails(${x.shop})">View Shop</button><button class="btn light" onclick="reserveProduct('${esc(x.name)}',${x.shop},'${esc(x.size)}')">Reserve</button></div></div>`}).join("");
}
