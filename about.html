
<!DOCTYPE html>
<html>
<head>
<title>DressFinder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding-bottom: 70px; }
  header { padding: 15px; border-bottom: 1px solid #eee; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 12px; color: #777; font-size: 14px; }
  #search { width: 90%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  #products { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { border: 1px solid #eee; border-radius: 10px; padding: 12px; text-align: center; }
  .card .emoji { font-size: 36px; }
  .card h3 { margin: 8px 0 4px; font-size: 15px; }
  .card p { margin: 0; color: #555; font-size: 13px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee;
        display: flex; justify-content: space-around; padding: 8px 0; }
  nav button { background: none; border: none; font-size: 12px; color: #555; }
  nav button.active { color: #007bff; font-weight: bold; }
  .empty { text-align: center; color: #999; padding: 30px; }
</style>
</head>
<body>

<header>
  <h1>DRESSFINDER</h1>
  <p>Find it • Check it • Reserve it</p>
  <input id="search" type="text" placeholder="🔍 Search product, brand, colour...">
</header>

<div id="products"></div>

<nav>
  <button onclick="setCategory('all')" id="btn-all">🏠<br>Home</button>
  <button onclick="setCategory('gents')" id="btn-gents">👕<br>Gents</button>
  <button onclick="setCategory('ladies')" id="btn-ladies">👗<br>Ladies</button>
  <button onclick="setCategory('kids')" id="btn-kids">🧒<br>Kids</button>
  <button onclick="setCategory('shoes')" id="btn-shoes">👟<br>Shoes</button>
  <button onclick="setCategory('shops')" id="btn-shops">🏬<br>Shops</button>
</nav>

<script>
const items = [
  {name:"Formal Shirt", cat:"gents", emoji:"👔", price:"₹799"},
  {name:"Denim Jeans", cat:"gents", emoji:"👖", price:"₹1199"},
  {name:"Party Saree", cat:"ladies", emoji:"👗", price:"₹2499"},
  {name:"Kurti", cat:"ladies", emoji:"👚", price:"₹899"},
  {name:"Kids T-Shirt", cat:"kids", emoji:"👕", price:"₹399"},
  {name:"Kids Frock", cat:"kids", emoji:"👗", price:"₹599"},
  {name:"Running Shoes", cat:"shoes", emoji:"👟", price:"₹1499"},
  {name:"Sandals", cat:"shoes", emoji:"🩴", price:"₹599"},
  {name:"City Mall Shop", cat:"shops", emoji:"🏬", price:"Visit"},
  {name:"Street Boutique", cat:"shops", emoji:"🏪", price:"Visit"}
];

let currentCat = "all";

function render() {
  const query = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('products');
  container.innerHTML = "";

  let filtered = items.filter(i => currentCat === "all" || i.cat === currentCat);
  filtered = filtered.filter(i => i.name.toLowerCase().includes(query));

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">No items found 😕</div>';
    return;
  }

  filtered.forEach(i => {
    container.innerHTML += `
      <div class="card">
        <div class="emoji">${i.emoji}</div>
        <h3>${i.name}</h3>
        <p>${i.price}</p>
      </div>`;
  });
}

function setCategory(cat) {
  currentCat = cat;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + cat).classList.add('active');
  render();
}

document.getElementById('search').addEventListener('input', render);

setCategory('all');
</script>

</body>
</html>
