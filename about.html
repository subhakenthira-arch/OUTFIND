<!DOCTYPE html>
<html>
<head>
<title>DressFinder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding-bottom: 70px; }
  header { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: flex-start; }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 4px 0 12px; color: #777; font-size: 13px; }
  #search { width: 90%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin: 0 15px 10px; }

  #filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 15px 10px; }
  #filters select { flex: 1 1 45%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; background: #fafafa; }

  #products { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { border: 1px solid #eee; border-radius: 10px; padding: 12px; text-align: center; }
  .card .emoji { font-size: 36px; }
  .card h3 { margin: 8px 0 2px; font-size: 15px; }
  .card .tag { font-size: 11px; color: #999; }
  .card p { margin: 4px 0 0; color: #007bff; font-weight: bold; font-size: 14px; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee;
        display: flex; justify-content: space-around; padding: 8px 0; }
  nav button { background: none; border: none; font-size: 12px; color: #555; }
  nav button.active { color: #007bff; font-weight: bold; }
  .empty { text-align: center; color: #999; padding: 30px; grid-column: 1/3; }

  #settingsBtn { background: #eef4ff; border: none; border-radius: 10px; width: 40px; height: 40px;
                 font-size: 20px; cursor: pointer; }
  #overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0;
             background: rgba(0,0,0,0.4); z-index: 100; }
  #settingsPanel { position: fixed; top:0; right:0; width: 80%; max-width: 320px; height: 100%;
                    background: #fff; z-index: 101; padding: 20px; overflow-y: auto;
                    transform: translateX(100%); transition: transform 0.25s ease; }
  #settingsPanel.open { transform: translateX(0); }
  #overlay.show { display: block; }
  .settings-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
  .settings-section { margin-bottom: 20px; }
  .settings-section label { display: block; font-size: 13px; color: #777; margin-bottom: 6px; }
  .settings-section input[type=text], .settings-section select {
     width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;
  }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0;
            background-color: #ccc; border-radius: 24px; transition: .2s; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
                    background-color: white; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background-color: #007bff; }
  input:checked + .slider:before { transform: translateX(20px); }
  #closeSettings { background:none; border:none; font-size:22px; float:right; }
  .saved-msg { color: green; font-size: 13px; margin-top: 6px; display:none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>DRESSFINDER</h1>
    <p>Find it • Check it • Reserve it</p>
  </div>
  <button id="settingsBtn" onclick="openSettings()">⚙️</button>
</header>

<input id="search" type="text" placeholder="🔍 Search product, brand, colour...">

<div id="filters">
  <select id="f-item" onchange="render()">
    <option value="">Item (All)</option>
  </select>
  <select id="f-wear" onchange="render()">
    <option value="">Wear (All)</option>
    <option value="formal">Formal</option>
    <option value="casual">Casual</option>
    <option value="party">Party</option>
    <option value="sports">Sports</option>
  </select>
  <select id="f-brand" onchange="render()">
    <option value="">Brand (All)</option>
  </select>
  <select id="f-colour" onchange="render()">
    <option value="">Colour (All)</option>
  </select>
  <select id="f-size" onchange="render()">
    <option value="">Size (All)</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
  </select>
  <select id="f-price" onchange="render()">
    <option value="">Price (All)</option>
    <option value="0-500">Under ₹500</option>
    <option value="500-1000">₹500 - ₹1000</option>
    <option value="1000-2000">₹1000 - ₹2000</option>
    <option value="2000-99999">Above ₹2000</option>
  </select>
</div>

<div id="products"></div>

<nav>
  <button onclick="setCategory('all')" id="btn-all">🏠<br>Home</button>
  <button onclick="setCategory('gents')" id="btn-gents">👕<br>Gents</button>
  <button onclick="setCategory('ladies')" id="btn-ladies">👗<br>Ladies</button>
  <button onclick="setCategory('kids')" id="btn-kids">🧒<br>Kids</button>
  <button onclick="setCategory('shoes')" id="btn-shoes">👟<br>Shoes</button>
  <button onclick="setCategory('shops')" id="btn-shops">🏬<br>Shops</button>
</nav>

<div id="overlay" onclick="closeSettings()"></div>
<div id="settingsPanel">
  <button id="closeSettings" onclick="closeSettings()">✖</button>
  <div class="settings-title">Settings</div>

  <div class="settings-section">
    <label>Name</label>
    <input type="text" id="userName" placeholder="Your name">
    <label style="margin-top:10px">Email</label>
    <input type="text" id="userEmail" placeholder="you@example.com">
  </div>

  <div class="settings-section">
    <label>Language</label>
    <select id="language" onchange="applyLanguage()">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
    </select>
  </div>

  <div class="settings-section">
    <div class="toggle-row">
      <label style="margin:0">Notifications</label>
      <label class="switch">
        <input type="checkbox" id="notifToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="settings-section">
    <label>Location</label>
    <select id="locationSelect">
      <option>Chennai</option>
      <option>Coimbatore</option>
      <option>Madurai</option>
      <option>Bengaluru</option>
      <option>Mumbai</option>
      <option>Delhi</option>
    </select>
    <button onclick="useCurrentLocation()" style="margin-top:8px; width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; background:#f5f5f5;">📍 Use current location</button>
  </div>

  <button onclick="saveSettings()" style="width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:8px; font-size:15px;">Save</button>
  <div class="saved-msg" id="savedMsg">Saved ✅</div>
</div>

<script>
const items = [
  // GENTS
  {name:"Formal Shirt", cat:"gents", item:"Shirt", wear:"formal", brand:"Allen Solly", colour:"White", size:"M", price:799, emoji:"👔"},
  {name:"Casual Shirt", cat:"gents", item:"Shirt", wear:"casual", brand:"Peter England", colour:"Blue", size:"L", price:699, emoji:"👕"},
  {name:"Denim Jeans", cat:"gents", item:"Jeans", wear:"casual", brand:"Levis", colour:"Blue", size:"32", price:1199, emoji:"👖"},
  {name:"Party Blazer", cat:"gents", item:"Blazer", wear:"party", brand:"Van Heusen", colour:"Black", size:"L", price:2999, emoji:"🧥"},
  {name:"Track Pant", cat:"gents", item:"Trackpant", wear:"sports", brand:"Nike", colour:"Grey", size:"M", price:899, emoji:"🩳"},
  {name:"Polo T-Shirt", cat:"gents", item:"T-Shirt", wear:"casual", brand:"Puma", colour:"Red", size:"L", price:599, emoji:"👕"},

  // LADIES
  {name:"Party Saree", cat:"ladies", item:"Saree", wear:"party", brand:"Fabindia", colour:"Red", size:"Free", price:2499, emoji:"👗"},
  {name:"Cotton Kurti", cat:"ladies", item:"Kurti", wear:"casual", brand:"W", colour:"Yellow", size:"M", price:899, emoji:"👚"},
  {name:"Formal Blazer", cat:"ladies", item:"Blazer", wear:"formal", brand:"Vero Moda", colour:"Black", size:"S", price:1899, emoji:"🧥"},
  {name:"Sports Leggings", cat:"ladies", item:"Leggings", wear:"sports", brand:"Nike", colour:"Black", size:"M", price:699, emoji:"🩱"},

  // KIDS
  {name:"Kids T-Shirt", cat:"kids", item:"T-Shirt", wear:"casual", brand:"H&M Kids", colour:"Blue", size:"S", price:399, emoji:"👕"},
  {name:"Kids Party Frock", cat:"kids", item:"Frock", wear:"party", brand:"Gini & Jony", colour:"Pink", size:"S", price:899, emoji:"👗"},

  // SHOES
  {name:"Running Shoes", cat:"shoes", item:"Sports Shoe", wear:"sports", brand:"Adidas", colour:"White", size:"9", price:1499, emoji:"👟"},
  {name:"Formal Shoes", cat:"shoes", item:"Formal Shoe", wear:"formal", brand:"Bata", colour:"Black", size:"8", price:1799, emoji:"👞"},
  {name:"Sandals", cat:"shoes", item:"Sandal", wear:"casual", brand:"Woodland", colour:"Brown", size:"9", price:599, emoji:"🩴"},

  // SHOPS
  {name:"City Mall Shop", cat:"shops", item:"Shop", wear:"", brand:"", colour:"", size:"", price:0, emoji:"🏬"},
  {name:"Street Boutique", cat:"shops", item:"Shop", wear:"", brand:"", colour:"", size:"", price:0, emoji:"🏪"}
];

let currentCat = "all";

function populateFilterOptions() {
  const relevant = currentCat === "all" ? items : items.filter(i => i.cat === currentCat);
  const itemSel = document.getElementById('f-item');
  const brandSel = document.getElementById('f-brand');
  const colourSel = document.getElementById('f-colour');

  const uniq = arr => [...new Set(arr)].filter(Boolean);

  itemSel.innerHTML = '<option value="">Item (All)</option>' +
    uniq(relevant.map(i => i.item)).map(v => `<option value="${v}">${v}</option>`).join('');
  brandSel.innerHTML = '<option value="">Brand (All)</option>' +
    uniq(relevant.map(i => i.brand)).map(v => `<option value="${v}">${v}</option>`).join('');
  colourSel.innerHTML = '<option value="">Colour (All)</option>' +
    uniq(relevant.map(i => i.colour)).map(v => `<option value="${v}">${v}</option>`).join('');
}

function render() {
  const query = document.getElementById('search').value.toLowerCase();
  const fItem = document.getElementById('f-item').value;
  const fWear = document.getElementById('f-wear').value;
  const fBrand = document.getElementById('f-brand').value;
  const fColour = document.getElementById('f-colour').value;
  const fSize = document.getElementById('f-size').value;
  const fPrice = document.getElementById('f-price').value;

  const container = document.getElementById('products');
  container.innerHTML = "";

  let filtered = items.filter(i => currentCat === "all" || i.cat === currentCat);
  filtered = filtered.filter(i => i.name.toLowerCase().includes(query));
  if (fItem) filtered = filtered.filter(i => i.item === fItem);
  if (fWear) filtered = filtered.filter(i => i.wear === fWear);
  if (fBrand) filtered = filtered.filter(i => i.brand === fBrand);
  if (fColour) filtered = filtered.filter(i => i.colour === fColour);
  if (fSize) filtered = filtered.filter(i => i.size === fSize);
  if (fPrice) {
    const [min, max] = fPrice.split('-').map(Number);
    filtered = filtered.filter(i => i.price >= min && i.price <= max);
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">No items found 😕</div>';
    return;
  }

  filtered.forEach(i => {
    container.innerHTML += `
      <div class="card">
        <div class="emoji">${i.emoji}</div>
        <h3>${i.name}</h3>
        <div class="tag">${i.brand ? i.brand + ' • ' + i.colour : ''}</div>
        <p>${i.price ? '₹' + i.price : 'Visit'}</p>
      </div>`;
  });
}

function setCategory(cat) {
  currentCat = cat;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + cat).classList.add('active');
  document.getElementById('f-item').value = "";
  document.getElementById('f-wear').value = "";
  document.getElementById('f-brand').value = "";
  document.getElementById('f-colour').value = "";
  document.getElementById('f-size').value = "";
  document.getElementById('f-price').value = "";
  populateFilterOptions();
  render();
}

document.getElementById('search').addEventListener('input', render);
setCategory('all');

// ---- Settings logic ----
function openSettings() {
  document.getElementById('settingsPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  loadSettings();
}
function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function loadSettings() {
  document.getElementById('userName').value = localStorage.getItem('df_name') || "";
  document.getElementById('userEmail').value = localStorage.getItem('df_email') || "";
  document.getElementById('language').value = localStorage.getItem('df_lang') || "en";
  document.getElementById('notifToggle').checked = localStorage.getItem('df_notif') === "true";
  document.getElementById('locationSelect').value = localStorage.getItem('df_location') || "Chennai";
}
function saveSettings() {
  localStorage.setItem('df_name', document.getElementById('userName').value);
  localStorage.setItem('df_email', document.getElementById('userEmail').value);
  localStorage.setItem('df_lang', document.getElementById('language').value);
  localStorage.setItem('df_notif', document.getElementById('notifToggle').checked);
  localStorage.setItem('df_location', document.getElementById('locationSelect').value);
  const msg = document.getElementById('savedMsg');
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 1500);
  applyLanguage();
}
function applyLanguage() {
  const lang = document.getElementById('language').value;
  if (lang === "ta") {
    document.querySelector('header h1').textContent = "டிரெஸ்ஃபைண்டர்";
    document.getElementById('search').placeholder = "🔍 தேடு தயாரிப்பு, பிராண்ட்...";
  } else {
    document.querySelector('header h1').textContent = "DRESSFINDER";
    document.getElementById('search').placeholder = "🔍 Search product, brand, colour...";
  }
}
function useCurrentLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => alert("Location detected: " + pos.coords.latitude.toFixed(2) + ", " + pos.coords.longitude.toFixed(2)),
      () => alert("Location access denied. Please select manually from the list.")
    );
  } else {
    alert("Geolocation not supported on this browser.");
  }
}
</script>

</body>
</html>
